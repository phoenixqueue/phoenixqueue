services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: phoenixqueue
      POSTGRES_PASSWORD: phoenixqueue
      POSTGRES_DB: phoenixqueue_development
    ports:
      # Use a non-default host port to avoid clashing with a local Postgres.
      - "54324:5432"
    volumes:
      - phoenixqueue_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U phoenixqueue -d phoenixqueue_development"]
      interval: 2s
      timeout: 5s
      retries: 30

  ruby:
    build: .
    working_dir: /app
    volumes:
      - .:/app
    environment:
      BUNDLE_PATH: /app/vendor/bundle
      PHOENIXQUEUE_DATABASE_URL: postgres://phoenixqueue:phoenixqueue@postgres:5432/phoenixqueue_development
      PHOENIXQUEUE_TEST_DATABASE_URL: postgres://phoenixqueue:phoenixqueue@postgres:5432/phoenixqueue_test
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  phoenixqueue_pgdata:

